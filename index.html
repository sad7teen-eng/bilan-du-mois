<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bilan du mois">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Bilan du mois</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: a trading-journal dashboard (stats + calendar you fill day by day), then a full-screen story that plays the month. Single dark look by design. */
:root{
  --bg:#060808;
  --panel:#0c1110;
  --panel-2:#111817;
  --line:#1c2523;
  --fg:#e8eeeb;
  --muted:#7a8984;
  --gain:#62e29c;
  --gain-dim:rgba(98,226,156,.13);
  --gain-edge:rgba(98,226,156,.38);
  --loss:#ff8f6b;
  --loss-dim:rgba(255,143,107,.13);
  --loss-edge:rgba(255,143,107,.4);
  --display:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --on-gain:#04120a;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
/* Light mode: dashboard and editors only; the story stays dark. */
body.light{background:#f2f5f4;color:#121816}
body.light .dash,body.light .modal{--bg:#f2f5f4;--panel:#ffffff;--panel-2:#f5f8f7;--line:#dce3e0;--fg:#121816;--muted:#62716c;--gain:#138a4e;--gain-dim:rgba(19,138,78,.09);--gain-edge:rgba(19,138,78,.32);--loss:#c9472a;--loss-dim:rgba(201,71,42,.09);--loss-edge:rgba(201,71,42,.32);--on-gain:#ffffff;color-scheme:light;color:var(--fg)}
body.light .modal{background:rgba(232,237,235,.78)}
body.light .ready{box-shadow:none}
body.light .cell:hover,body.light button:hover{border-color:#b9c5c1}
body.light .cell .add{color:#b4c0bc}
body{background:var(--bg);color:var(--fg);font-family:var(--display);-webkit-font-smoothing:antialiased}
button{font:500 12px var(--display);color:var(--fg);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button:hover{border-color:#34433f}
button.primary{background:var(--fg);color:var(--bg);border-color:var(--fg);font-family:var(--mono);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:11px;padding:10px 16px}
button.go{background:var(--gain);color:var(--on-gain);border-color:var(--gain);font-weight:600}
button.ghost{background:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.cell:focus-visible{outline:2px solid var(--gain);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.g{color:var(--gain)}.r{color:var(--loss)}

/* ---------- Dashboard ---------- */
.dash{--mono:var(--display);max-width:1180px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) 20px calc(48px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.dash .tile .lab,.dash .wk div{letter-spacing:.06em;font-size:10.5px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.top h1{margin:0;font-size:clamp(26px,4vw,36px);font-weight:600;letter-spacing:-.03em}
.top h1 .name{color:var(--gain)}
.top .meta{margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.top .meta .live{color:var(--gain)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.monthnav{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:3px;background:var(--panel)}
.monthnav button{border:0;background:transparent;padding:6px 10px}
.monthnav span{font-weight:600;font-size:13px;min-width:120px;text-align:center}
.ready{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 16px;border-radius:12px;border:1px solid var(--gain-edge);background:linear-gradient(90deg,var(--gain-dim),rgba(98,226,156,.04));box-shadow:0 0 40px rgba(98,226,156,.06)}
.ready .l{display:flex;align-items:center;gap:12px;min-width:0}
.ready .ic{width:30px;height:30px;border-radius:8px;background:var(--gain);display:grid;place-items:center;flex:none}
.ready .ic::after{content:"";border-left:9px solid #04120a;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}
.ready b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gain);font-weight:600}
.ready span{font-family:var(--mono);font-size:13px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:14px}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile.wide{grid-column:1/-1}
.tile .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.tile .val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:24px;font-weight:600;letter-spacing:-.02em}
.tile .val.xl{font-size:32px}
.tile .note{font-size:11px;color:var(--muted)}
.tile .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.spark{width:100%;height:46px;display:block}
.ring{width:46px;height:46px;flex:none}
.bar{display:flex;height:6px;border-radius:4px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.cal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cal-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cal-h h2{margin:0;font-size:14px;font-weight:600}
.cal-h .tot{font-family:var(--mono);font-size:14px;font-weight:600}
.wk,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wk div{font-size:10.5px;color:var(--muted);text-align:center;padding:2px 0}
.cell{position:relative;aspect-ratio:1;min-height:0;border-radius:12px;border:1px solid transparent;background:var(--panel-2);padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font:inherit;color:inherit;min-width:0;transition:transform .15s ease,border-color .15s ease}
.cell:hover{border-color:#34433f;transform:translateY(-1px)}
.cell.blank{visibility:hidden;cursor:default}
.cell .dn{position:absolute;top:6px;left:8px;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cell .p{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;margin-top:8px}
.cell .c{font-size:9.5px;color:var(--muted)}
.cell.up{background:linear-gradient(160deg,rgba(98,226,156,.22),rgba(98,226,156,.07));border-color:rgba(98,226,156,.18)}
.cell.up .p{color:var(--gain)}
.cell.down{background:linear-gradient(160deg,rgba(255,143,107,.22),rgba(255,143,107,.07));border-color:rgba(255,143,107,.18)}
.cell.down .p{color:var(--loss)}
.cell .add{font-size:15px;color:#33403d;margin-top:8px}
.cell.today{border-color:var(--fg)}
.cell.other{opacity:.4}
.cal .help{font-size:11.5px;color:var(--muted);margin:0}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-nav button{padding:4px 10px}
.monthtoggle{width:100%;padding:11px;font-size:13px}
.savebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.savebar .st{flex:1;min-width:180px}
.savebar .st.ok{color:var(--gain)}
.savebar button{padding:5px 10px;font-size:11.5px}
.savebar .syncst{flex-basis:100%;min-width:0}
.syncst.ok{color:var(--gain)}.syncst.wait{color:var(--muted)}.syncst.err{color:var(--loss,#e5484d)}
.syncbox{display:flex;gap:6px;flex-basis:100%}.syncbox[hidden]{display:none!important}
.syncbox input{flex:1;min-width:0;padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);font-size:12px}
@media (max-width:560px){.cell{border-radius:9px}.cell .dn{top:4px;left:5px;font-size:9px}.cell .p{font-size:10.5px;margin-top:9px}.cell .c{display:none}.cell .add{display:none}.wk div{font-size:9px}}

/* ---------- Modals ---------- */
.modal{position:fixed;inset:0;background:rgba(3,5,5,.78);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:20}
.sheet{width:100%;max-width:860px;max-height:calc(100% - 8px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.sheet .sum{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:940px}
th{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:500;padding:9px 8px;background:var(--panel-2);border-bottom:1px solid var(--line)}
td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
input,select,textarea{font:13px var(--mono);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 9px;width:100%;box-sizing:border-box}
td.del{width:36px}
td.del button{padding:6px 9px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:600px){.fields{grid-template-columns:1fr 1fr}}
label{display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--muted);letter-spacing:.03em;min-width:0}
textarea{min-height:160px;line-height:1.55;resize:vertical;white-space:pre;overflow-x:auto}
.help{font-size:12px;line-height:1.5;color:var(--muted);margin:0}
.help code{font-family:var(--mono);color:var(--fg);font-size:11.5px}
.actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.actions div{display:flex;gap:8px;flex-wrap:wrap}
.err{color:var(--loss);font-size:12px;margin:0}


/* ---------- Ordinateur : menu à gauche, contenu plus large ---------- */
.side{display:none}
@media (min-width:1100px){
  .side{display:flex;flex-direction:column;gap:22px;position:fixed;top:0;bottom:0;left:0;width:232px;padding:26px 16px;border-right:1px solid var(--line);background:var(--panel);z-index:5;--mono:var(--display)}
  .s-brand b{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em}
  .s-brand span{font-size:12px;color:var(--muted)}
  .s-nav,.s-bottom{display:flex;flex-direction:column;gap:4px}
  .s-bottom{margin-top:auto}
  .side button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;border:0;border-radius:9px;background:transparent;font-size:13.5px;color:var(--muted)}
  .side button:hover{background:var(--panel-2);color:var(--fg)}
  .side button.on{background:var(--panel-2);color:var(--fg)}
  .side button svg{width:18px;height:18px;flex:none}
  .side .s-play{color:var(--gain)}
  .s-saved{font-size:11.5px;color:var(--gain);padding:6px 12px}
  .dash{margin-left:232px;max-width:1240px;padding-left:36px;padding-right:36px}
  .dash .tools #btnSettings,.dash .tools #btnTheme{display:none}
  .dash > .apps,.dash > .savebar{display:none}
  .grid{grid-template-columns:minmax(0,1fr) minmax(0,1.55fr)}
  .cal .cell{aspect-ratio:auto;min-height:88px}
  .cal .cell .p{font-size:14px}
}
@media (min-width:1500px){.dash{margin-left:auto;margin-right:auto;transform:translateX(116px)}}

/* ---------- Fiche du jour : un trade = une carte, modifiable ---------- */
.modal{--mono:var(--display)}
.sheet{box-sizing:border-box}
.daysheet{max-width:440px;gap:12px;padding:16px}
@media (max-width:640px){#dayModal,#certEditModal{padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(14px + env(safe-area-inset-bottom,0px))}.daysheet{max-height:100%}}
.modal{padding-top:max(16px,calc(10px + env(safe-area-inset-top,0px)));padding-bottom:max(16px,calc(10px + env(safe-area-inset-bottom,0px)))}
.daysheet .dh{position:sticky;top:-16px;z-index:3;background:var(--panel);margin:-16px -16px 0;padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dh h2{font-size:20px}
.dh .sum{font-size:13px;margin-top:2px}
.tlist{display:flex;flex-direction:column;gap:12px}
.tcard,.tedit{border:1px solid var(--line);border-radius:14px;background:var(--panel-2);padding:12px;display:flex;flex-direction:column;gap:12px}
.tcard.up{border-color:rgba(98,226,156,.18)}
.tcard.down{border-color:rgba(255,143,107,.18)}
.t-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.t-sym{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px;font-weight:600}
.chip2{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.chip2.long{color:var(--gain);border-color:rgba(98,226,156,.25)}
.chip2.short{color:var(--loss);border-color:rgba(255,143,107,.25)}
.grade{font-size:11px;font-weight:600;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
.t-res{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.t-curve svg{width:100%;height:64px;display:block}
.t-meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.t-meta .rr{font-weight:600;margin-left:4px}
.t-ana{font-size:13.5px;line-height:1.5;color:#cfd8d4;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:64px;height:64px;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:3px;right:3px;width:20px;height:20px;padding:0;border-radius:6px;font-size:11px;line-height:1;background:rgba(0,0,0,.65);border:0;color:#fff}
.t-acts{display:flex;flex-direction:column;gap:8px}
.t-acts .edit{align-self:flex-end;padding:8px 16px;font-size:14px;font-weight:500;border-radius:9px;background:transparent}
.t-acts .play{width:100%;padding:13px;font-size:14px;font-weight:600;border-radius:11px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.tedit input,.tedit textarea{font:15px var(--display);border-radius:10px;padding:11px 12px;background:var(--bg)}
.tedit .fld.tiny{flex-direction:row;align-items:center;gap:10px;font-size:12px}
.tedit .fld.tiny input{width:auto;max-width:120px;font-size:13px;padding:6px 9px;border-radius:8px}
.tedit .pnl{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tedit textarea{min-height:96px;white-space:normal;line-height:1.5;resize:vertical}
.seg2{display:flex;gap:6px}
.seg2 button{flex:1;padding:10px;border-radius:10px;font-size:14px;background:var(--bg)}
.seg2 button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg2 button.on.long{background:var(--gain);border-color:var(--gain);color:var(--on-gain)}
.seg2 button.on.short{background:var(--loss);border-color:var(--loss);color:#1a0904}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;font-size:13px;color:var(--muted);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--gain);background:rgba(98,226,156,.06);color:var(--fg)}
.e-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.e-acts .grow{flex:1}
.e-acts .save{padding:11px 18px;font-size:14px;font-weight:600;border-radius:10px}
.e-acts .mini{padding:9px 12px;border-radius:10px}
.e-acts .del{color:var(--loss);background:transparent}
.addtrade{padding:12px;border-style:dashed;border-radius:12px;font-size:14px;background:transparent}
/* Tes jours : barres par jour de la semaine */
.wdbars{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:10px;align-items:stretch;height:120px}
.wdb{display:flex;flex-direction:column;align-items:center;min-width:0}
.wdb .up,.wdb .dn2{flex:1;display:flex;justify-content:center;width:100%}
.wdb .up{align-items:flex-end}
.wdb .dn2{align-items:flex-start}
.wdb i{display:block;width:min(26px,70%);border-radius:5px;min-height:3px}
.wdb .up i{background:var(--gain);box-shadow:0 0 14px rgba(98,226,156,.35)}
.wdb .dn2 i{background:var(--loss)}
.wdb .axis{width:100%;height:1px;background:var(--line);margin:2px 0}
.wdlab span{display:flex;flex-direction:column;align-items:center}
.wdlab{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:10px;text-align:center;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bestday{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel-2)}
.bestday small{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bestday b{font-size:16px}
.bestday span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.slide .wdbars{width:min(420px,86vw);height:170px}
.slide .wdb .up i{transform-origin:bottom;transform:scaleY(0)}
.slide .wdb .dn2 i{transform-origin:top;transform:scaleY(0)}
.slide.on .wdb i{animation:grow .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0) * 140ms + 350ms)}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.slide .wdlab span{opacity:0}
.slide.on .wdlab span{animation:rise .6s ease both;animation-delay:calc(var(--k,0) * 140ms + 250ms)}
.slide .bestday{opacity:0}
.slide.on .bestday{animation:rise .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:1.4s}
.wdval{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:4px;white-space:nowrap}
.slide.on .wdval{animation:rise .6s ease both;animation-delay:calc(var(--k,0) * 140ms + 900ms)}
.hero{position:relative;width:min(440px,82vw);border-radius:18px;overflow:hidden;border:1px solid rgba(232,238,235,.14);box-shadow:0 40px 90px rgba(0,0,0,.7),0 0 80px rgba(98,226,156,.12)}
.hero.red{box-shadow:0 40px 90px rgba(0,0,0,.7),0 0 80px rgba(255,143,107,.14)}
.hero img{display:block;width:100%;max-height:56vh;object-fit:cover}
.herowrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.rpill{font-size:clamp(26px,7vw,40px);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;padding:6px 18px;border-radius:14px;background:rgba(98,226,156,.1);border:1px solid rgba(98,226,156,.25)}
.rpill.r{background:rgba(255,143,107,.1);border-color:rgba(255,143,107,.28)}
.slide .rpill{opacity:0}
.slide.on .rpill{animation:rpop .7s cubic-bezier(.2,1.4,.4,1) both;animation-delay:1.3s}
@keyframes rpop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.slide.on .hero{animation:heroIn 1.2s cubic-bezier(.16,.8,.2,1) both}
.slide.on .hero img{animation:kb 7s ease-out both}
@keyframes heroIn{from{opacity:0;transform:translateY(40px) scale(.92) rotate(-1.5deg);filter:blur(14px)}to{opacity:1;transform:none;filter:none}}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.78));pointer-events:none}

/* Courbe arrondie sans faux creux (cubique monotone), verte au-dessus de zéro, rouge en dessous */
function smoothPath(pts){
  const n = pts.length; if (n < 2) return "";
  if (n === 2) return `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)} L${pts[1][0].toFixed(1)} ${pts[1][1].toFixed(1)}`;
  const dx = [], sl = [], m = [];
  for (let i = 0; i < n - 1; i++) { dx[i] = pts[i + 1][0] - pts[i][0]; sl[i] = (pts[i + 1][1] - pts[i][1]) / (dx[i] || 1); }
  m[0] = sl[0]; m[n - 1] = sl[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = sl[i - 1] * sl[i] <= 0 ? 0 : (sl[i - 1] + sl[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (sl[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
    const a = m[i] / sl[i], b = m[i + 1] / sl[i], h = a * a + b * b;
    if (h > 9) { const t = 3 / Math.sqrt(h); m[i] = t * a * sl[i]; m[i + 1] = t * b * sl[i]; }
  }
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < n - 1; i++) {
    const h = dx[i] / 3;
    d += ` C${(pts[i][0] + h).toFixed(1)} ${(pts[i][1] + m[i] * h).toFixed(1)} ${(pts[i + 1][0] - h).toFixed(1)} ${(pts[i + 1][1] - m[i + 1] * h).toFixed(1)} ${pts[i + 1][0].toFixed(1)} ${pts[i + 1][1].toFixed(1)}`;
  }
  return d;
}

let crop = null;
function openCrop(src){
  const img = $("cropImg");
  img.onload = () => {
    const vp = $("cropVp").getBoundingClientRect();
    const base = Math.max(vp.width / img.naturalWidth, vp.height / img.naturalHeight);
    crop = {src, w: img.naturalWidth, h: img.naturalHeight, base, z: 1, x: 0, y: 0, vw: vp.width, vh: vp.height};
    $("cropZoom").value = 1;
    crop.x = (vp.width - crop.w * base) / 2; crop.y = (vp.height - crop.h * base) / 2;
    drawCrop();
  };
  $("crop").hidden = false; img.src = src;
}
function clampCrop(){
  const sc = crop.base * crop.z, iw = crop.w * sc, ih = crop.h * sc;
  crop.x = Math.min(0, Math.max(crop.vw - iw, crop.x)); crop.y = Math.min(0, Math.max(crop.vh - ih, crop.y));
}
function drawCrop(){ clampCrop(); const sc = crop.base * crop.z; $("cropImg").style.transform = `translate(${crop.x}px,${crop.y}px) scale(${sc})`; }
$("cropZoom").addEventListener("input", e => {
  if (!crop) return;
  const old = crop.base * crop.z; crop.z = +e.target.value; const nw = crop.base * crop.z;
  const cx = crop.vw / 2, cy = crop.vh / 2;
  crop.x = cx - (cx - crop.x) * nw / old; crop.y = cy - (cy - crop.y) * nw / old; drawCrop();
});
(() => {
  let drag = null; const vp = $("cropVp");
  vp.addEventListener("pointerdown", e => { if (!crop) return; drag = {x: e.clientX, y: e.clientY, cx: crop.x, cy: crop.y}; vp.setPointerCapture(e.pointerId); vp.style.cursor = "grabbing"; });
  vp.addEventListener("pointermove", e => { if (!drag) return; crop.x = drag.cx + e.clientX - drag.x; crop.y = drag.cy + e.clientY - drag.y; drawCrop(); });
  const end = () => { drag = null; vp.style.cursor = ""; };
  vp.addEventListener("pointerup", end); vp.addEventListener("pointercancel", end);
  vp.addEventListener("wheel", e => { if (!crop) return; e.preventDefault(); const z = Math.min(4, Math.max(1, crop.z * (e.deltaY < 0 ? 1.08 : 0.92))); $("cropZoom").value = z; $("cropZoom").dispatchEvent(new Event("input")); }, {passive: false});
})();
async function finishCrop(keep){
  if (!crop || !edit) { $("crop").hidden = true; return; }
  let out = crop.src;
  if (!keep) {
    const sc = crop.base * crop.z, c = document.createElement("canvas");
    c.width = 1600; c.height = 1000;
    c.getContext("2d").drawImage($("cropImg"), -crop.x / sc, -crop.y / sc, crop.vw / sc, crop.vh / sc, 0, 0, 1600, 1000);
    out = c.toDataURL("image/jpeg", .88);
  }
  await idb.set(edit.id + "#main", [out]);
  crop = null; $("crop").hidden = true; drawDay();
}

function curveSVG(curve){
  const W = 640, H = 220, P = 14;
  const min = Math.min(0, ...curve), max = Math.max(0, ...curve), span = (max - min) || 1;
  const x = i => P + i * (W - 2 * P) / Math.max(1, curve.length - 1), y = v => P + (max - v) / span * (H - 2 * P);
  const pts = curve.map((v, i) => [x(i), y(v)]), y0 = y(0);
  const d = smoothPath(pts);
  const last = pts[pts.length - 1], up = curve[curve.length - 1] >= 0, col = up ? "#62e29c" : "#ff8f6b";
  const area = d + ` L${last[0].toFixed(1)} ${y0.toFixed(1)} L${pts[0][0].toFixed(1)} ${y0.toFixed(1)} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe des gains">
    <defs>${zeroGrad("cl", y0, H, "#eaf3ee", "#ff8f6b", 1, 1)}${zeroGrad("ag", y0, H, "#62e29c", "#ff8f6b", .2, .22)}</defs>
    <line x1="${P}" x2="${W - P}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}" stroke="#2a3532" stroke-dasharray="3 5" stroke-width="1"/>
    <path class="curve-area" d="${area}" fill="url(#ag)"/><path class="curve-line" d="${d}" style="stroke:url(#cl)"/>
    <circle class="curve-dot" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="5" fill="${col}"/></svg>`;
}
function tradeCard(t, red){
  const rTxt = t.r != null && t.r !== "" && isFinite(+t.r) ? ((+t.r > 0 ? "+" : "") + String(t.r).replace(".", ",") + "R") : "";

  return `<div class="card${red ? " red" : ""} rise" style="--d:2">
    <div class="c-top"><div class="c-sym">${esc(t.sym)}<span class="c-side ${side}">${esc(t.side)}</span></div>${rTxt ? `<span class="c-r ${+t.r < 0 ? "r" : "g"}">${rTxt}</span>` : ""}</div>
    <div class="c-meta">${t.day} ${MONTHS[state.month].toLowerCase()}${t.time ? `<i></i>${esc(t.time)}` : ""}${t.lots ? `<i></i>${t.lots} lots` : ""}${t.grade ? `<i></i>Note ${esc(t.grade)}` : ""}</div>
    ${t.note ? `<q>${esc(t.note)}</q>` : ""}</div>`;
}

  return out;

function buildTradeSlides(t, imgs, monthNet, main){

  const word = (w, cls) => `<span class="w">${[...w].map(ch => `<span class="ltr${cls ? " " + cls : ""}" style="--i:${li++}">${esc(ch)}</span>`).join("")}</span>`;
  const hello = state.greet.split(/\s+/).filter(Boolean).map(w => word(w)).join(" ") + " " + state.name.split(/\s+/).filter(Boolean).map(w => word(w, "name")).join(" ");
  const when = `${t.day} ${MONTHS[state.month].toLowerCase()}${t.time ? " · " + t.time : ""}`;
  out.push(`<div class="inner"><div class="hello">${hello}</div>
    <div class="banner rise" style="--d:${Math.min(9, Math.ceil(li * 45 / 130) + 2)}"><i class="dot"></i>
    <div><b>Voici ton trade</b><span>${esc(t.sym)} · ${esc(String(t.side).toUpperCase())} · ${esc(when)}</span></div></div></div>`);
  const rTxt = t.r != null && t.r !== "" && isFinite(+t.r) ? ((+t.r > 0 ? "+" : "") + String(t.r).replace(".", ",") + "R") : "";
  if (main) out.push(`<div class="inner"${t.pnl < 0 ? " data-red" : ""}><div class="herowrap"><div class="hero${t.pnl < 0 ? " red" : ""}"><img src="${main}" alt="Photo du trade">
    <div class="ht"><div><small>${esc(t.sym)} · ${esc(String(t.side).toUpperCase())}${t.time ? " · " + esc(t.time) : ""}</small><b>${t.day} ${MONTHS[state.month].toLowerCase()}</b></div></div></div>
    ${rTxt ? `<span class="rpill ${+t.r < 0 ? "r" : "g"}">${rTxt}</span>` : ""}</div></div>`);
  imgs.forEach((src, i) => out.push(`<div class="inner"><div class="shotwrap"><img class="shot" src="${src}" alt="Capture du trade ${i + 1}">${imgs.length > 1 ? `<span class="shotn">${i + 1} / ${imgs.length}</span>` : ""}</div></div>`));
  const red = t.pnl < 0;
  out.push(`<div class="inner"${red ? " data-red" : ""}><span class="pill rise${red ? " red" : ""}">Résultat du trade</span>
    <div class="big ${red ? "loss" : "gain"} rise" style="--d:1" data-count="${t.pnl}">${money(t.pnl)}</div>${tradeCard(t, red)}</div>`);
  out.push(`<div class="inner"${monthNet < 0 ? " data-red" : ""}><span class="pill rise${monthNet < 0 ? " red" : ""}">${esc(monthName())}</span>
    <div class="sub rise" style="--d:1">Total du mois</div>
    <div class="big ${monthNet < 0 ? "loss" : "gain"} rise" style="--d:2" data-count="${monthNet}">${money(monthNet)}</div>
    ${state.handle ? `<div class="handle rise" style="--d:3">${esc(state.handle)}</div>` : ""}</div>`);
  return out;
}

let idx = 0, els = [], timer = null, anims = [];
const story = $("story"), stage = $("stage"), progress = $("progress");
let DUR = [];
function openStory(auto, slides, durs){
  if (!slides) { if (!state.trades.length) return; slides = buildSlides(); durs = [2600, 1900, 2600, 3100, 2800, 2700, 3000, 2400]; }
  DUR = durs || [];
  stage.innerHTML = slides.map(h => `<section class="slide">${h}</section>`).join("");
  els = [...stage.querySelectorAll(".slide")];
  progress.innerHTML = els.map(() => `<div class="seg"><i></i></div>`).join("");
  story.hidden = false; document.body.style.overflow = "hidden";
  go(0); if (auto) startAuto();
}
function closeStory(){ stopAuto(); story.hidden = true; document.body.style.overflow = ""; }
function countUp(el){
  const target = parseFloat(el.dataset.count);
  if (reduced) { el.textContent = money(target); return; }
  const t0 = performance.now(), dur = 1300;
  const step = now => { const k = Math.min(1, (now - t0) / dur); el.textContent = money(target * (1 - Math.pow(1 - k, 3))); if (k < 1) anims.push(requestAnimationFrame(step)); };
  el.style.minWidth = ""; el.textContent = money(target); el.style.minWidth = el.getBoundingClientRect().width + "px";
  el.textContent = money(0); anims.push(requestAnimationFrame(step));
}
function drawCurve(slide){
  const chart = slide.querySelector(".chart"); if (!chart) return;
  const path = chart.querySelector(".curve-line");
  chart.classList.remove("drawn");
  const len = path.getTotalLength();
  path.style.transition = "none"; path.style.strokeDasharray = len; path.style.strokeDashoffset = reduced ? 0 : len;
  path.getBoundingClientRect();
  if (!reduced) path.style.transition = "stroke-dashoffset 1.7s cubic-bezier(.45,0,.2,1) .15s";
  path.style.strokeDashoffset = 0; chart.classList.add("drawn");
}
function go(i){
  anims.forEach(cancelAnimationFrame); anims = [];
  idx = Math.max(0, Math.min(els.length - 1, i));
  els.forEach((el, j) => el.classList.toggle("on", j === idx));
  [...progress.children].forEach((seg, j) => seg.classList.toggle("done", j <= idx));
  const el = els[idx];
  stage.classList.toggle("red", !!el.querySelector("[data-red]"));
  el.querySelectorAll("[data-count]").forEach(countUp);
  drawCurve(el);
}
function schedule(){ clearTimeout(timer); if (idx < els.length - 1) timer = setTimeout(() => { go(idx + 1); schedule(); }, DUR[idx] || 3600); }
function startAuto(){ story.classList.add("filming"); go(0); schedule(); }
function stopAuto(){ clearTimeout(timer); timer = null; story.classList.remove("filming"); }
stage.addEventListener("click", () => { if (story.classList.contains("filming")) { stopAuto(); return; } go(idx >= els.length - 1 ? 0 : idx + 1); });
$("btnPlay").onclick = () => openStory(false);
$("sAuto").onclick = startAuto;
$("sReplay").onclick = () => { stopAuto(); go(0); };
$("sClose").onclick = closeStory;
$("sFull").onclick = () => { try { const p = document.documentElement.requestFullscreen?.(); p && p.catch(() => {}); } catch(e) {} };
document.addEventListener("keydown", e => {
  if (!story.hidden) {
    if (e.key === "Escape") closeStory();
    if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); stopAuto(); go(idx + 1); }
    if (e.key === "ArrowLeft") { stopAuto(); go(idx - 1); }
    return;
  }
  const open = [...document.querySelectorAll(".modal")].find(m => !m.hidden);
  if (open && e.key === "Escape") open.hidden = true;
});

/* ===== Synchro téléphone ↔ ordinateur via GitHub (branche bilan-sync) =====
   Même token que le Cap (même site). Fusion à trois voies : ce qui a changé ici gagne,
   ce qui a changé ailleurs arrive ici, rien n'est écrasé par une version plus ancienne.
   Les photos voyagent une par une (bilan/img/…), seulement quand elles changent. */
window.BSync = (() => {
  const REPO = "sad7teen-eng/bilan-du-mois", BR = "bilan-sync", API = "https://api.github.com/repos/" + REPO + "/contents/";
  const META = "month-review-sync";
  const tok = () => { try { return localStorage.getItem("cap-gh-token") || ""; } catch(e) { return ""; } };
  let meta = {base: null, localH: {}};
  try { const m = JSON.parse(localStorage.getItem(META) || "null"); if (m) meta = {base: m.base || null, localH: m.localH || {}}; } catch(e) {}
  const keep = () => { try { localStorage.setItem(META, JSON.stringify(meta)); } catch(e) {} };
  const hash = v => { const x = JSON.stringify(v || []); if (x === "[]") return "0"; let h = 5381; for (let i = 0; i < x.length; i++) h = ((h * 33) ^ x.charCodeAt(i)) >>> 0; return x.length.toString(36) + "-" + h.toString(36); };
  const J = x => x === undefined ? undefined : JSON.stringify(x);
  const b64 = str => { const u = new TextEncoder().encode(str); let bin = ""; for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(bin); };
  const unb64 = c => new TextDecoder().decode(Uint8Array.from(atob(c.replace(/\s/g, "")), ch => ch.charCodeAt(0)));
  const safe = k => k.replace(/[^a-zA-Z0-9_-]/g, ch => "_" + ch.charCodeAt(0).toString(16));
  const hdr = (raw) => ({Authorization: "Bearer " + tok(), Accept: raw ? "application/vnd.github.raw" : "application/vnd.github+json"});

  /* idb.set passe par ici : on retient l'empreinte de chaque photo modifiée */
  const rawSet = idb.set;
  idb.set = async (k, v) => { meta.localH[k] = hash(v); keep(); const r = await rawSet(k, v); soon(); return r; };

  function snap(){
    if (!state.archive || typeof state.archive !== "object") state.archive = {};
    state.archive[state.year + "-" + state.month] = state.trades;
    const trades = {};
    Object.entries(state.archive).forEach(([k, list]) => { if (!Array.isArray(list)) return; const [y, m] = k.split("-").map(Number); list.forEach(t => { if (t && t.id) trades[t.id] = {...t, y, m}; }); });
    const certs = {}; (state.certs || []).forEach(c => { if (c && c.id) certs[c.id] = {...c}; });
    const settings = {}; ["greet", "name", "ready", "currency", "handle"].forEach(k => { if (state[k] !== undefined) settings[k] = state[k]; });
    return {trades, certs, settings, seedSkip: [...new Set(state.seedSkip || [])].sort()};
  }
  const fill = (r, l) => {
    if (!r || typeof r !== "object" || !l || typeof l !== "object") return r ?? l;
    const o = {...l, ...r}; Object.keys(l).forEach(k => { const e = v => v === "" || v == null; if (e(r[k]) && !e(l[k])) o[k] = l[k]; }); return o;
  };
  function merge3(base, loc, rem){
    const out = {}, ids = new Set([...Object.keys(base || {}), ...Object.keys(loc || {}), ...Object.keys(rem || {})]);
    ids.forEach(id => {
      const l = (loc || {})[id], r = (rem || {})[id];
      if (!base) { const v = (r !== undefined && l !== undefined) ? fill(r, l) : (r !== undefined ? r : l); if (v !== undefined) out[id] = v; return; }
      const b = base[id], lc = J(l) !== J(b);
      const v = lc ? l : r;
      if (v !== undefined) out[id] = v;
    });
    return out;
  }
  async function localH(k){ if (meta.localH[k] === undefined) meta.localH[k] = hash(await idb.get(k)); return meta.localH[k]; }

  async function getFile(path, raw){
    const r = await fetch(API + path + "?ref=" + BR + "&t=" + Date.now(), {headers: hdr(raw), cache: "no-store"});
    if (r.status === 404) return null;
    if (!r.ok) throw new Error("get " + r.status);
    return raw ? r.text() : r.json();
  }
  async function putFile(path, text, sha, msg){
    for (let i = 0; i < 2; i++) {
      const body = {message: msg, content: b64(text), branch: BR}; if (sha) body.sha = sha;
      const r = await fetch(API + path, {method: "PUT", headers: {...hdr(), "Content-Type": "application/json"}, body: JSON.stringify(body)});
      if (r.ok) return (await r.json()).content.sha;
      if (r.status === 409 || r.status === 422) { const cur = await getFile(path).catch(() => null); sha = cur && cur.sha; if (i === 0) continue; }
      throw new Error("put " + r.status);
    }
  }
  async function delFile(path, sha){
    if (!sha) { const cur = await getFile(path).catch(() => null); sha = cur && cur.sha; if (!sha) return; }
    await fetch(API + path, {method: "DELETE", headers: {...hdr(), "Content-Type": "application/json"}, body: JSON.stringify({message: "Bilan : photo retirée", sha, branch: BR})});
  }

  function apply(d){
    const arch = {};
    Object.values(d.trades).forEach(t => { const {y, m, ...rest} = t; const k = y + "-" + m; (arch[k] = arch[k] || []).push(rest); });
    Object.values(arch).forEach(l => l.sort((a, b) => a.day - b.day || String(a.time || "").localeCompare(String(b.time || ""))));
    const ck = state.year + "-" + state.month; if (!arch[ck]) arch[ck] = [];
    state.archive = arch; state.trades = arch[ck];
    state.certs = Object.values(d.certs); Object.assign(state, d.settings); state.seedSkip = d.seedSkip.slice();
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {}
  }
  const blocked = () => ["dayModal", "certModal", "certEditModal", "setModal", "story", "lightbox"].some(id => { const e = $(id); return e && !e.hidden; });

  function st(txt, cls){ ["syncSt", "sSync"].forEach(id => { const e = $(id); if (e) { e.textContent = txt; e.className = (id === "sSync" ? "s-saved syncst " : "st syncst ") + (cls || ""); } }); }
  function idle(){
    const on = !!tok();
    $("btnSync").hidden = on;
    if (!on) st("Synchro désactivée : collez votre token dans le Cap (bouton Synchro) ou ici.", "wait");
  }
  const stamp = () => { const d = new Date(); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); };

  let timer = null, busy = false, again = false;
  function soon(ms){ if (!tok()) { idle(); return; } clearTimeout(timer); timer = setTimeout(run, ms ?? 1500); }
  async function run(){
    if (!tok()) { idle(); return; }
    if (busy) { again = true; return; }
    if (blocked()) { soon(4000); return; }
    busy = true; st("Synchronisation…", "wait");
    try {
      let ok = false;
      for (let i = 0; i < 3 && !ok; i++) ok = await once();
      if (!ok) throw new Error("conflit");
      st("✓ Synchronisé · téléphone + ordinateur · " + stamp(), "ok");
    } catch(e) {
      st(/401|403/.test(String(e.message)) ? "Synchro refusée : le token n'est plus valable." : "Synchro en attente (pas de connexion ?) · nouvel essai bientôt", "err");
      clearTimeout(timer); timer = setTimeout(run, 30000);
    }
    busy = false;
    if (again) { again = false; soon(800); }
  }
  async function once(){
    const remote = await getFile("bilan/state.json");
    const rd = remote ? JSON.parse(unb64(remote.content)) : {trades: {}, certs: {}, settings: {}, seedSkip: [], imgs: {}};
    const base = meta.base, loc = snap();
    const seedSkip = [...new Set([...(loc.seedSkip || []), ...(rd.seedSkip || [])])].sort();
    const trades = merge3(base && base.trades, loc.trades, rd.trades || {});
    seedSkip.forEach(id => { delete trades[id]; });
    const certs = merge3(base && base.certs, loc.certs, rd.certs || {});
    const settings = merge3(base && base.settings, loc.settings, rd.settings || {});

    /* photos */
    const keys = new Set();
    Object.keys(trades).forEach(id => [id, id + "#main", id + "#orig"].forEach(k => keys.add(k)));
    Object.keys(certs).forEach(id => keys.add("cert:" + id));
    Object.keys(loc.trades).forEach(id => [id, id + "#main", id + "#orig"].forEach(k => keys.add(k)));
    Object.keys(loc.certs).forEach(id => keys.add("cert:" + id));
    Object.keys(rd.imgs || {}).forEach(k => keys.add(k));
    if (base) Object.keys(base.imgs || {}).forEach(k => keys.add(k));
    const imgs = {...(rd.imgs || {})}, down = [];
    for (const k of keys) {
      const l = await localH(k), r = (rd.imgs || {})[k] ? rd.imgs[k].h : "0";
      const path = "bilan/img/" + safe(k) + ".json";
      let up = false, dn = false;
      if (!base) { if (l !== "0" && r === "0") up = true; else if (r !== "0" && l !== r) dn = true; }
      else { const b = (base.imgs || {})[k] ? base.imgs[k].h : "0"; if (l !== b && l !== r) up = true; else if (r !== b && r !== l) dn = true; }
      if (up) {
        if (l === "0") { await delFile(path, (rd.imgs || {})[k] && rd.imgs[k].sha); delete imgs[k]; }
        else { const v = await idb.get(k); const sha = await putFile(path, JSON.stringify(v), (rd.imgs || {})[k] && rd.imgs[k].sha, "Bilan : photo " + k); imgs[k] = {h: l, sha}; }
      } else if (dn) down.push([k, r, path]);
    }
    const data = {v: 1, trades, certs, settings, seedSkip, imgs};
    const same = J({trades: rd.trades || {}, certs: rd.certs || {}, settings: rd.settings || {}, seedSkip: rd.seedSkip || [], imgs: rd.imgs || {}}) === J({trades, certs, settings, seedSkip, imgs});
    if (!same) {
      const body = {message: "Bilan : synchro " + new Date().toISOString(), content: b64(JSON.stringify({...data, updatedAt: new Date().toISOString()})), branch: BR};
      if (remote) body.sha = remote.sha;
      const r = await fetch(API + "bilan/state.json", {method: "PUT", headers: {...hdr(), "Content-Type": "application/json"}, body: JSON.stringify(body)});
      if (r.status === 409 || r.status === 422) return false;
      if (!r.ok) throw new Error("put " + r.status);
    }
    for (const [k, h, path] of down) {
      let v = [];
      if (h !== "0") { const txt = await getFile(path, true); v = txt ? JSON.parse(txt) : []; }
      await rawSet(k, v); meta.localH[k] = hash(v);
    }
    const before = J(snap());
    if (blocked()) { soon(4000); return true; } /* une fenêtre s'est ouverte : on appliquera à la fermeture */
    apply(data);
    meta.base = data; keep();
    if (J(snap()) !== before || down.length) { try { renderDash(); } catch(e) {} }
    return true;
  }

  $("btnSync").onclick = () => { $("syncBox").hidden = false; $("syncIn").focus(); };
  $("syncSave").onclick = () => { const v = $("syncIn").value.trim(); if (!v) return; try { localStorage.setItem("cap-gh-token", v); } catch(e) {} $("syncIn").value = ""; $("syncBox").hidden = true; idle(); soon(0); };
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") soon(300); });
  setInterval(() => { if (document.visibilityState === "visible" && !busy) run(); }, 45000);
  idle();
  return {soon, run};
})();

/* Mise à jour automatique : si une nouvelle version est en ligne, la page se recharge toute seule */
const APP_VERSION = "2026-10-18-2";
async function checkUpdate(){
  try{
    const r = await fetch(location.pathname + "?check=" + Date.now(), {cache:"no-store"});
    if(!r.ok) return;
    const m = (await r.text()).match(/APP_VERSION = "([^"]+)"/);
    if(m && m[1] !== APP_VERSION){
      const story = document.getElementById("story");
      if(story && !story.hidden) return; /* jamais pendant une animation */
      location.replace(location.pathname + "?v=" + encodeURIComponent(m[1]));
    }
  }catch(e){}
}
checkUpdate();
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") checkUpdate(); });
