<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bilan du mois">
<meta name="theme-color" content="#000000">
<title>Bilan du mois</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: a trading-journal dashboard (stats + calendar you fill day by day), then a full-screen story that plays the month. Single dark look by design. */
:root{
  --bg:#060808;
  --panel:#0c1110;
  --panel-2:#111817;
  --line:#1c2523;
  --fg:#e8eeeb;
  --muted:#7a8984;
  --gain:#62e29c;
  --gain-dim:rgba(98,226,156,.13);
  --gain-edge:rgba(98,226,156,.38);
  --loss:#ff8f6b;
  --loss-dim:rgba(255,143,107,.13);
  --loss-edge:rgba(255,143,107,.4);
  --display:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --on-gain:#04120a;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
/* Light mode: dashboard and editors only; the story stays dark. */
body.light{background:#f2f5f4;color:#121816}
body.light .dash,body.light .modal{--bg:#f2f5f4;--panel:#ffffff;--panel-2:#f5f8f7;--line:#dce3e0;--fg:#121816;--muted:#62716c;--gain:#138a4e;--gain-dim:rgba(19,138,78,.09);--gain-edge:rgba(19,138,78,.32);--loss:#c9472a;--loss-dim:rgba(201,71,42,.09);--loss-edge:rgba(201,71,42,.32);--on-gain:#ffffff;color-scheme:light;color:var(--fg)}
body.light .modal{background:rgba(232,237,235,.78)}
body.light .ready{box-shadow:none}
body.light .cell:hover,body.light button:hover{border-color:#b9c5c1}
body.light .cell .add{color:#b4c0bc}
body{background:var(--bg);color:var(--fg);font-family:var(--display);-webkit-font-smoothing:antialiased}
button{font:500 12px var(--display);color:var(--fg);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button:hover{border-color:#34433f}
button.primary{background:var(--fg);color:var(--bg);border-color:var(--fg);font-family:var(--mono);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:11px;padding:10px 16px}
button.go{background:var(--gain);color:var(--on-gain);border-color:var(--gain);font-weight:600}
button.ghost{background:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.cell:focus-visible{outline:2px solid var(--gain);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.g{color:var(--gain)}.r{color:var(--loss)}

/* ---------- Dashboard ---------- */
.dash{max-width:1180px;margin:0 auto;padding:28px 20px 48px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.top h1{margin:0;font-size:clamp(26px,4vw,36px);font-weight:600;letter-spacing:-.03em}
.top h1 .name{color:var(--gain)}
.top .meta{margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.top .meta .live{color:var(--gain)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.monthnav{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:3px;background:var(--panel)}
.monthnav button{border:0;background:transparent;padding:6px 10px}
.monthnav span{font-weight:600;font-size:13px;min-width:120px;text-align:center}
.ready{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 16px;border-radius:12px;border:1px solid var(--gain-edge);background:linear-gradient(90deg,var(--gain-dim),rgba(98,226,156,.04));box-shadow:0 0 40px rgba(98,226,156,.06)}
.ready .l{display:flex;align-items:center;gap:12px;min-width:0}
.ready .ic{width:30px;height:30px;border-radius:8px;background:var(--gain);display:grid;place-items:center;flex:none}
.ready .ic::after{content:"";border-left:9px solid #04120a;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}
.ready b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gain);font-weight:600}
.ready span{font-family:var(--mono);font-size:13px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:14px}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile.wide{grid-column:1/-1}
.tile .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.tile .val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:24px;font-weight:600;letter-spacing:-.02em}
.tile .val.xl{font-size:32px}
.tile .note{font-size:11px;color:var(--muted)}
.tile .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.spark{width:100%;height:46px;display:block}
.ring{width:46px;height:46px;flex:none}
.bar{display:flex;height:6px;border-radius:4px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.cal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cal-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cal-h h2{margin:0;font-size:14px;font-weight:600}
.cal-h .tot{font-family:var(--mono);font-size:14px;font-weight:600}
.wk,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wk div{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center;padding:5px 0;border-radius:6px;background:var(--panel-2)}
.cell{position:relative;min-height:74px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);padding:7px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;text-align:left;font:inherit;color:inherit;min-width:0}
.cell:hover{border-color:#3a4a46}
.cell.blank{visibility:hidden;cursor:default}
.cell .dn{font-family:var(--mono);font-size:10px;color:var(--muted);align-self:flex-end}
.cell .p{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .c{font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.cell.up{background:var(--gain-dim);border-color:var(--gain-edge)}
.cell.up .p{color:var(--gain)}
.cell.down{background:var(--loss-dim);border-color:var(--loss-edge)}
.cell.down .p{color:var(--loss)}
.cell .add{font-family:var(--mono);font-size:16px;color:#3b4a46;align-self:center}
.cal .help{font-size:11.5px;color:var(--muted);margin:0}
@media (max-width:560px){.cell{min-height:58px;padding:5px}.cell .p{font-size:10.5px}.cell .c{display:none}.wk div{font-size:9px}}

/* ---------- Modals ---------- */
.modal{position:fixed;inset:0;background:rgba(3,5,5,.78);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:20}
.sheet{width:100%;max-width:860px;max-height:calc(100% - 8px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.sheet .sum{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:940px}
th{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:500;padding:9px 8px;background:var(--panel-2);border-bottom:1px solid var(--line)}
td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
input,select,textarea{font:13px var(--mono);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 9px;width:100%;box-sizing:border-box}
td.del{width:36px}
td.del button{padding:6px 9px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:600px){.fields{grid-template-columns:1fr 1fr}}
label{display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--muted);letter-spacing:.03em;min-width:0}
textarea{min-height:160px;line-height:1.55;resize:vertical;white-space:pre;overflow-x:auto}
.help{font-size:12px;line-height:1.5;color:var(--muted);margin:0}
.help code{font-family:var(--mono);color:var(--fg);font-size:11.5px}
.actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.actions div{display:flex;gap:8px;flex-wrap:wrap}
.err{color:var(--loss);font-size:12px;margin:0}

/* ---------- Story ---------- */
.story{position:fixed;inset:0;height:100dvh;background:var(--bg);z-index:30;display:flex;flex-direction:column;overflow:hidden}
.progress{display:flex;gap:6px;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 0}
.seg{flex:1;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.seg i{display:block;height:100%;width:0;background:var(--fg);opacity:.85;transition:width .5s ease}
.seg.done i{width:100%}
.stage{position:relative;flex:1;cursor:pointer;user-select:none}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(40% 38% at 50% 48%,rgba(98,226,156,.10),transparent 70%);transition:opacity .8s;pointer-events:none}
.stage.red::before{background:radial-gradient(40% 38% at 50% 48%,rgba(255,143,107,.10),transparent 70%)}
.slide{position:absolute;inset:0;display:grid;place-items:center;padding:24px 16px;opacity:0;transform:translateY(10px) scale(.985);transition:opacity .55s ease,transform .8s cubic-bezier(.2,.7,.2,1);pointer-events:none}
.slide.on{opacity:1;transform:none}
.inner{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;max-width:760px;width:100%}
.slide.on .rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0) * 130ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.hello{font-size:clamp(38px,7.5vw,92px);font-weight:600;letter-spacing:-.035em;line-height:1.02;text-wrap:balance}
.hello .w{display:inline-block;white-space:nowrap}
.hello .ltr{display:inline-block;opacity:0}
.slide.on .hello .ltr{animation:rise .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 45ms + 150ms)}
.hello .name{color:var(--gain);text-shadow:0 0 30px rgba(98,226,156,.35)}
.banner{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;border:1px solid var(--gain-edge);background:var(--gain-dim);text-align:left}
.banner .dot{width:8px;height:8px;border-radius:50%;background:var(--gain);box-shadow:0 0 10px var(--gain);animation:pulse 1.6s ease-in-out infinite;flex:none}
@keyframes pulse{50%{opacity:.35}}
.banner b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gain);font-weight:600}
.banner span{font-family:var(--mono);font-size:12px}
.pill{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;padding:6px 13px;border-radius:999px;border:1px solid var(--gain-edge);background:var(--gain-dim);color:var(--gain)}
.pill.red{border-color:var(--loss-edge);background:var(--loss-dim);color:var(--loss)}
.title{font-size:clamp(44px,9vw,104px);font-weight:600;letter-spacing:-.035em;line-height:.95;text-wrap:balance;text-shadow:0 0 40px rgba(232,238,235,.12)}
.sub{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.big{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:clamp(32px,6vw,72px);font-weight:600;letter-spacing:-.03em;line-height:1;white-space:nowrap;text-align:center;display:inline-block}
.big.gain{color:var(--gain);text-shadow:0 0 36px rgba(98,226,156,.35)}
.big.loss{color:var(--loss);text-shadow:0 0 36px rgba(255,143,107,.32)}
.stats{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin-top:-4px}
.stat{display:flex;flex-direction:column;gap:4px;align-items:center}
.stat b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:18px;font-weight:600}
.stat span{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.chart{width:100%;max-width:640px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.curve-line{fill:none;stroke:#eaf3ee;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px rgba(234,243,238,.45))}
.curve-area{opacity:0;transition:opacity .8s ease 1.1s}
.curve-dot{opacity:0;transition:opacity .4s ease 1.7s}
.drawn .curve-area,.drawn .curve-dot{opacity:1}
.chips{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.chip{display:flex;flex-direction:column;gap:3px;padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-width:132px}
.chip span{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.chip b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px}
.chip em{font-style:normal;font-size:11px;color:var(--muted)}
.card{width:100%;max-width:400px;text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--gain-edge);background:linear-gradient(180deg,rgba(98,226,156,.10),rgba(98,226,156,.03));display:flex;flex-direction:column;gap:6px}
.card.red{border-color:var(--loss-edge);background:linear-gradient(180deg,rgba(255,143,107,.10),rgba(255,143,107,.03))}
.card .meta{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.card .sym{font-weight:700;font-size:15px}
.card .sym small{font-weight:500;font-size:11px;color:var(--muted);margin-left:6px;letter-spacing:.08em}
.card .setup{font-size:12px;color:var(--muted)}
.card .setup b{color:var(--fg);font-weight:600}
.card q{font-size:13px;line-height:1.45;color:#cfd8d4;font-style:italic}
.moral{font-size:12px;color:var(--muted)}
.handle{font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:.06em}
.hint{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));text-align:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);opacity:.7;pointer-events:none}
.sdock{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;transition:opacity .3s}
.filming .sdock,.filming .hint{opacity:0;pointer-events:none}
.shotwrap{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.slide.on .shotwrap{animation:drift 7s ease-out both}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.035)}}
.shot{display:block;max-width:min(92vw,1040px);max-height:68vh;width:auto;height:auto;border-radius:14px;border:1px solid rgba(232,238,235,.12);box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 70px rgba(98,226,156,.10)}
.slide.on .shot{animation:shotIn 1s cubic-bezier(.2,.7,.2,1) both}
@keyframes shotIn{from{opacity:0;transform:translateY(18px) scale(1.06);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
.shotn{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--muted)}
td .go,td .imgb{white-space:nowrap;padding:7px 10px}
.pnlw{display:flex;gap:6px;align-items:center}
.pnlw input{flex:1;min-width:0}
td .sgn{flex:none;width:38px;height:36px;padding:0;font:600 18px var(--display);color:var(--gain);background:var(--gain-dim);border-color:var(--gain-edge)}
td .sgn.neg{color:var(--loss);background:var(--loss-dim);border-color:var(--loss-edge)}
/* ---------- Phone ---------- */
@media (max-width:640px){
  .dash{padding:20px 14px 40px;gap:14px}
  .tools{width:100%}
  .monthnav{flex:1;justify-content:space-between}
  .ready{padding:12px}
  .ready button{width:100%}
  .tiles{gap:10px}
  .tile .val{font-size:20px}.tile .val.xl{font-size:28px}
  .sheet{padding:16px;max-height:calc(100% - 4px)}
  .tbl-wrap{border:0;overflow:visible}
  table{min-width:0}
  thead{display:none}
  tbody{display:flex;flex-direction:column;gap:10px}
  tr{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
  td{display:flex;flex-direction:column;gap:4px;padding:0;border:0;width:auto!important;min-width:0}
  td[data-l]::before{content:attr(data-l);font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  td[data-l="Setup"],td[data-l="Commentaire"]{grid-column:1/-1}
  td.del{grid-column:1/-1}
  td.del button{width:100%}
  td button{width:100%}
  .actions,.actions div{width:100%}
  .actions button{flex:1}
  .hello{font-size:13vw}
  .title{font-size:14vw}
  .big{font-size:clamp(34px,12.5vw,72px)}
  .pill{font-size:10px}
  .banner{max-width:100%}
  .stats{gap:18px}
  .card{max-width:100%}
  .chips .chip{min-width:0;flex:1}
  .shot{max-width:94vw;max-height:62vh;border-radius:12px}
  .sdock{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));justify-content:stretch}
  .sdock button{flex:1;padding:9px 6px;font-size:11px}
  #sFull{display:none}
  .hint{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){.slide.on .shotwrap,.slide.on .shot{animation:none}.slide,.seg i,.curve-area,.curve-dot{transition:none}.slide.on .rise,.slide.on .hello .ltr,.banner .dot{animation:none}.hello .ltr{opacity:1}}
</style>

<div class="dash" id="dash">
  <header class="top">
    <div>
      <h1 id="hello"></h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="tools">
      <div class="monthnav">
        <button type="button" id="prevM" aria-label="Mois précédent">‹</button>
        <span id="monthLabel"></span>
        <button type="button" id="nextM" aria-label="Mois suivant">›</button>
      </div>
      <button type="button" id="btnTheme" aria-label="Changer de thème"></button>
      <button type="button" id="btnSettings">Réglages</button>
    </div>
  </header>

  <section class="ready">
    <div class="l"><span class="ic"></span><div><b id="readyTitle"></b><span id="readyLine"></span></div></div>
    <button type="button" class="primary" id="btnPlay">Lancer mon mois</button>
  </section>

  <div class="grid">
    <div class="tiles" id="tiles"></div>
    <section class="cal">
      <div class="cal-h"><h2 id="calTitle"></h2><span class="tot" id="calTot"></span></div>
      <div class="wk"><div>Dim</div><div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div><div>Ven</div><div>Sam</div></div>
      <div class="days" id="days"></div>
      <p class="help">Clique sur un jour pour saisir ses trades.</p>
    </section>
  </div>
</div>

<!-- Day editor -->
<div class="modal" id="dayModal" hidden>
  <form class="sheet" id="dayForm">
    <div><h2 id="dayTitle"></h2><div class="sum" id="daySum"></div></div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Résultat</th><th>Actif</th><th>Sens</th><th>Setup</th><th>Note</th><th>Commentaire</th><th>Captures</th><th>Animation</th><th></th></tr></thead>
        <tbody id="dayRows"></tbody>
      </table>
    </div>
    <input type="file" id="imgPick" accept="image/*" multiple hidden>
    <p class="err" id="dayErr" hidden></p>
    <div class="actions">
      <button type="button" id="addRow">+ Ajouter un trade</button>
      <div><button type="button" class="ghost" id="dayCancel">Annuler</button><button type="submit" class="go">Enregistrer</button></div>
    </div>
  </form>
</div>

<!-- Settings -->
<div class="modal" id="setModal" hidden>
  <form class="sheet" id="setForm">
    <h2>Réglages</h2>
    <div class="fields">
      <label for="fGreet">Salutation<input id="fGreet" maxlength="30"></label>
      <label for="fName">Prénom<input id="fName" maxlength="24"></label>
      <label for="fHandle">Ton compte<input id="fHandle" maxlength="40"></label>
      <label for="fReady">Titre du bandeau<input id="fReady" maxlength="50"></label>
      <label for="fCur">Devise<input id="fCur" maxlength="3"></label>
    </div>
    <label for="fBulk">Tous les trades du mois en texte (pour coller d'un coup)
      <textarea id="fBulk" spellcheck="false"></textarea>
    </label>
    <p class="help">Une ligne par trade : <code>jour;résultat;actif;sens;setup;note;commentaire</code></p>
    <p class="err" id="setErr" hidden></p>
    <div class="actions">
      <div><button type="button" id="btnSample">Charger l'exemple</button><button type="button" id="btnClear">Vider le mois</button></div>
      <div><button type="button" class="ghost" id="setCancel">Fermer</button><button type="submit" class="go">Enregistrer</button></div>
    </div>
  </form>
</div>

<!-- Story -->
<div class="story" id="story" hidden>
  <div class="progress" id="progress"></div>
  <main class="stage" id="stage" aria-live="polite"></main>
  <div class="hint">Touche pour continuer</div>
  <div class="sdock">
    <button type="button" id="sClose">Retour au tableau</button>
    <button type="button" id="sFull">Plein écran</button>
    <button type="button" id="sReplay">Rejouer</button>
    <button type="button" class="go" id="sAuto">Lecture auto</button>
  </div>
</div>

<script>
const MONTHS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const SAMPLE_TEXT = `1;+420;XAUUSD;Long;London sweep;A;J'ai attendu le sweep. Propre.
2;-180;XAUUSD;Short;NY open FVG;B;Entré une bougie trop tôt.
2;+265;XAUUSD;Long;H1 zone retest;A;
3;+959.50;XAUUSD;Long;NY open FVG;A;Meilleure exécution de la semaine. Je n'y ai plus touché après l'entrée.
4;-240;XAUUSD;Short;Asia high sweep;C;Forcé un vendredi sans volume.
7;+312;XAUUSD;Long;H4 demand;A;
8;+188;XAUUSD;Long;London sweep;B;
8;-150;XAUUSD;Short;NY open FVG;B;
9;+405;XAUUSD;Short;H1 supply;A;
10;-210;XAUUSD;Long;M15 shift;B;
11;+530;XAUUSD;Long;NY open FVG;A;
14;-497.50;XAUUSD;Long;NY open FVG;C;J'ai bougé mon stop parce que je sentais le retournement. Il n'est jamais venu.
15;-120;XAUUSD;Short;Asia high sweep;B;
16;+290;XAUUSD;Short;H1 supply;A;
17;+360;XAUUSD;Long;London sweep;A;
18;-200;XAUUSD;Long;M15 shift;B;
21;+440;XAUUSD;Long;H4 demand;A;
22;+175;XAUUSD;Short;NY open FVG;B;
23;-160;XAUUSD;Short;H1 supply;B;
24;+520;XAUUSD;Long;London sweep;A;
25;+210;XAUUSD;Long;M15 shift;A;
28;-230;XAUUSD;Short;Asia high sweep;C;
29;+380;XAUUSD;Long;NY open FVG;A;
30;+295;XAUUSD;Long;H1 zone retest;A;`;

function parseText(text){
  const out = [], bad = [];
  text.split(/\r?\n/).forEach((line, i) => {
    if (!line.trim()) return;
    const f = line.split(";").map(x => x.trim());
    const day = parseInt(f[0], 10), pnl = num(f[1]);
    if (!(day >= 1 && day <= 31) || !isFinite(pnl)) { bad.push(i + 1); return; }
    out.push({day, pnl, sym: f[2] || "XAUUSD", side: f[3] || "Long", setup: f[4] || "", grade: f[5] || "", note: f.slice(6).join(";")});
  });
  return {trades: out, bad};
}
const num = v => parseFloat(String(v ?? "").replace(/\s/g, "").replace(",", "."));
const toText = ts => [...ts].sort((a, b) => a.day - b.day).map(t => [t.day, (t.pnl >= 0 ? "+" : "") + t.pnl, t.sym, t.side, t.setup, t.grade, t.note].join(";")).join("\n");

const DEFAULT = {greet: "Bonsoir,", name: "Kael", ready: "Ton bilan du mois est prêt", currency: "€", handle: "@kael.hq", year: 2026, month: 8, trades: parseText(SAMPLE_TEXT).trades};
const KEY = "month-review-v3";
let state = JSON.parse(JSON.stringify(DEFAULT));
try {
  const s = JSON.parse(localStorage.getItem(KEY) || "null");
  if (s && Array.isArray(s.trades)) state = {...state, ...s};
  else {
    const old = JSON.parse(localStorage.getItem("month-review-v2") || "null");
    if (old && Array.isArray(old.trades)) state = {...state, name: old.name || state.name, currency: old.currency || state.currency, handle: old.handle ?? state.handle, year: old.year ?? state.year, month: old.month ?? state.month, trades: old.trades};
  }
} catch(e) {}
if (state.currency === "$") state.currency = "€";
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
state.trades.forEach(t => { if (!t.id) t.id = uid(); });
const imgCache = {};
const idb = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => { try { const r = indexedDB.open("month-review", 1); r.onupgradeneeded = () => r.result.createObjectStore("imgs"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch(e) { rej(e); } }));
  return {
    async get(k){ if (imgCache[k]) return imgCache[k]; try { const db = await open(); const v = await new Promise(res => { const q = db.transaction("imgs").objectStore("imgs").get(k); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); }); imgCache[k] = v; return v; } catch(e) { return imgCache[k] || []; } },
    async set(k, v){ imgCache[k] = v; try { const db = await open(); await new Promise(res => { const tx = db.transaction("imgs", "readwrite"); tx.objectStore("imgs").put(v, k); tx.oncomplete = res; tx.onerror = res; }); } catch(e) {} }
  };
})();
function shrink(file){
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => {
      const k = Math.min(1, 1800 / Math.max(im.width, im.height)), c = document.createElement("canvas");
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", .86));
    }; im.onerror = () => res(null); im.src = fr.result; };
    fr.onerror = () => res(null); fr.readAsDataURL(file);
  });
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const cur = () => state.currency || "$";
const monthName = () => `${MONTHS[state.month]} ${state.year}`;
const mon3 = () => MONTHS[state.month].slice(0, 3);
function money(v, c = cur(), signed = true){
  const s = v < 0 ? "-" : (signed ? "+" : "");
  return s + c + Math.abs(v).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
const short = v => (v < 0 ? "-" : "+") + cur() + (Math.abs(v) >= 1000 ? (Math.abs(v) / 1000).toFixed(2).replace(/\.?0+$/, "") + "K" : Math.abs(v).toFixed(Math.abs(v) % 1 ? 2 : 0));

function stats(trades){
  const winsT = trades.filter(t => t.pnl > 0), lossT = trades.filter(t => t.pnl < 0);
  const gw = winsT.reduce((a, t) => a + t.pnl, 0), gl = Math.abs(lossT.reduce((a, t) => a + t.pnl, 0));
  const net = gw - gl;
  const byDay = new Map();
  trades.forEach(t => { const d = byDay.get(t.day) || {pnl: 0, n: 0}; d.pnl += t.pnl; d.n++; byDay.set(t.day, d); });
  const days = [...byDay.entries()].sort((a, b) => a[0] - b[0]);
  let c = 0; const curve = [0, ...days.map(d => (c += d[1].pnl))];
  const sd = [...days].sort((a, b) => a[1].pnl - b[1].pnl), st = [...trades].sort((a, b) => a.pnl - b.pnl);
  return {
    n: trades.length, wins: winsT.length, losses: lossT.length, net, byDay, days, curve,
    winrate: winsT.length + lossT.length ? Math.round(winsT.length / (winsT.length + lossT.length) * 100) : 0,
    pf: gl ? gw / gl : (gw ? Infinity : 0),
    avgW: winsT.length ? gw / winsT.length : 0, avgL: lossT.length ? gl / lossT.length : 0,
    bestDay: sd[sd.length - 1], worstDay: sd[0], bestTrade: st[st.length - 1], worstTrade: st[0]
  };
}

/* ---------- Dashboard ---------- */
function renderDash(){
  const s = stats(state.trades);
  $("hello").innerHTML = `${esc(state.greet)} <span class="name">${esc(state.name)}</span>`;
  $("meta").innerHTML = `${s.n} trades · ${s.days.length} jours de trading · <span class="live">● journal à jour</span>`;
  $("monthLabel").textContent = monthName();
  $("readyTitle").textContent = state.ready;
  $("readyLine").innerHTML = `${esc(monthName())} · <span class="${s.net < 0 ? "r" : "g"}">${s.n ? money(s.net) : "—"}</span> · ${s.n} trades`;
  $("btnPlay").disabled = !s.n;

  const spark = (() => {
    if (s.curve.length < 2) return "";
    const W = 300, H = 46, min = Math.min(...s.curve), max = Math.max(...s.curve), span = (max - min) || 1;
    const pts = s.curve.map((v, i) => [i * W / (s.curve.length - 1), 4 + (max - v) / span * (H - 8)]);
    const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    const col = s.net < 0 ? "var(--loss)" : "var(--gain)";
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L${W} ${H} L0 ${H} Z" style="fill:${col};fill-opacity:.12"/><path d="${d}" style="fill:none;stroke:${col}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
  })();
  const ring = (pct, col) => { const r = 19, C = 2 * Math.PI * r; return `<svg class="ring" viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="${r}" style="fill:none;stroke:var(--line)" stroke-width="5"/><circle cx="23" cy="23" r="${r}" style="fill:none;stroke:${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(C * Math.min(1, pct)).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 23 23)"/></svg>`; };
  const pfTxt = s.pf === Infinity ? "∞" : s.pf.toFixed(2);
  const wTot = s.avgW + s.avgL || 1;
  $("tiles").innerHTML = `
    <div class="tile wide"><span class="lab">Résultat net</span><span class="val xl ${s.net < 0 ? "r" : "g"}">${s.n ? money(s.net) : "—"}</span>${spark}<span class="note">${esc(monthName())}</span></div>
    <div class="tile"><span class="lab">Taux de réussite</span><div class="row"><span class="val">${s.winrate}%</span>${ring(s.winrate / 100, "var(--gain)")}</div><span class="note"><span class="g">${s.wins} gagnants</span> · <span class="r">${s.losses} perdants</span></span></div>
    <div class="tile"><span class="lab">Facteur de profit</span><div class="row"><span class="val">${pfTxt}</span>${ring(s.pf === Infinity ? 1 : Math.min(1, s.pf / 3), "var(--fg)")}</div><span class="note">Gains bruts / pertes brutes</span></div>
    <div class="tile wide"><span class="lab">Gain moyen / perte moyenne</span><div class="row"><span class="val"><span class="g">${money(s.avgW, cur(), false)}</span> <span style="color:var(--muted)">/</span> <span class="r">${money(s.avgL, cur(), false)}</span></span><span class="note">${s.avgL ? "Ratio " + (s.avgW / s.avgL).toFixed(2) : ""}</span></div><div class="bar"><i style="width:${(s.avgW / wTot * 100).toFixed(1)}%;background:var(--gain)"></i><i style="width:${(s.avgL / wTot * 100).toFixed(1)}%;background:var(--loss)"></i></div></div>`;

  $("calTitle").textContent = monthName();
  $("calTot").innerHTML = s.n ? `<span class="${s.net < 0 ? "r" : "g"}">${money(s.net)}</span>` : "";
  const first = new Date(state.year, state.month, 1).getDay(), dim = new Date(state.year, state.month + 1, 0).getDate();
  let html = "";
  for (let i = 0; i < first; i++) html += `<div class="cell blank" aria-hidden="true"></div>`;
  for (let d = 1; d <= dim; d++) {
    const x = s.byDay.get(d);
    if (x) html += `<button type="button" class="cell ${x.pnl < 0 ? "down" : "up"}" data-day="${d}" aria-label="${d} ${MONTHS[state.month]} : ${money(x.pnl)}"><span class="dn">${d}</span><span class="p">${short(x.pnl)}</span><span class="c">${x.n} trade${x.n > 1 ? "s" : ""}</span></button>`;
    else html += `<button type="button" class="cell" data-day="${d}" aria-label="Ajouter des trades le ${d}"><span class="dn">${d}</span><span class="add">+</span><span class="c">&nbsp;</span></button>`;
  }
  $("days").innerHTML = html;
}

$("days").addEventListener("click", e => { const c = e.target.closest("[data-day]"); if (c) openDay(+c.dataset.day); });
$("prevM").onclick = () => shiftMonth(-1);
$("nextM").onclick = () => shiftMonth(1);
/* Each month keeps its own trades: switching month files the current one in the archive and loads the other. */
const mkey = (y, m) => y + "-" + m;
function shiftMonth(k){
  if (!state.archive || typeof state.archive !== "object") state.archive = {};
  state.archive[mkey(state.year, state.month)] = state.trades;
  let m = state.month + k, y = state.year;
  if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
  state.month = m; state.year = y;
  state.trades = Array.isArray(state.archive[mkey(y, m)]) ? state.archive[mkey(y, m)] : [];
  save(); renderDash();
}

/* ---------- Day editor ---------- */
let draft = [], dayOpen = 0;
async function openDay(d){
  dayOpen = d;
  draft = state.trades.filter(t => t.day === d).map(t => ({...t}));
  if (!draft.length) draft.push(blankRow());
  await Promise.all(draft.map(t => idb.get(t.id)));
  $("dayTitle").textContent = `${d} ${MONTHS[state.month].toLowerCase()} ${state.year}`;
  $("dayErr").hidden = true;
  drawRows(); $("dayModal").hidden = false;
  const f = $("dayRows").querySelector("input"); f && f.focus();
}
const blankRow = () => ({id: uid(), pnl: "", sym: "XAUUSD", side: "Long", setup: "", grade: "A", note: ""});
function drawRows(){
  $("dayRows").innerHTML = draft.map((t, i) => `<tr>
    <td data-l="Résultat" style="width:150px"><div class="pnlw"><button type="button" class="sgn${num(t.pnl) < 0 ? " neg" : ""}" data-sign="${i}" aria-label="Passer en gain ou en perte">${num(t.pnl) < 0 ? "−" : "+"}</button><input id="r${i}-pnl" data-i="${i}" data-k="pnl" inputmode="decimal" placeholder="250" value="${esc(t.pnl)}"></div></td>
    <td data-l="Actif" style="width:100px"><input id="r${i}-sym" data-i="${i}" data-k="sym" value="${esc(t.sym)}"></td>
    <td data-l="Sens" style="width:92px"><select id="r${i}-side" data-i="${i}" data-k="side">${["Long","Short"].map(o => `<option${o === t.side ? " selected" : ""}>${o}</option>`).join("")}</select></td>
    <td data-l="Setup"><input id="r${i}-setup" data-i="${i}" data-k="setup" placeholder="NY open FVG" value="${esc(t.setup)}"></td>
    <td data-l="Note" style="width:70px"><select id="r${i}-grade" data-i="${i}" data-k="grade">${["A","B","C",""].map(o => `<option value="${o}"${o === t.grade ? " selected" : ""}>${o || "—"}</option>`).join("")}</select></td>
    <td data-l="Commentaire"><input id="r${i}-note" data-i="${i}" data-k="note" placeholder="Ce que j'en retiens" value="${esc(t.note)}"></td>
    <td data-l="Captures" style="width:120px"><button type="button" class="imgb" data-img="${i}">${(imgCache[t.id] || []).length ? "Changer (" + imgCache[t.id].length + ")" : "+ Images"}</button></td>
    <td data-l="Animation" style="width:104px"><button type="button" class="go" data-play="${i}">▶ Lancer</button></td>
    <td class="del"><button type="button" data-del="${i}" aria-label="Supprimer ce trade">✕</button></td></tr>`).join("");
  updateSum();
}
function updateSum(){
  const vals = draft.map(t => num(t.pnl)).filter(isFinite);
  const tot = vals.reduce((a, b) => a + b, 0);
  $("daySum").innerHTML = vals.length ? `${vals.length} trade${vals.length > 1 ? "s" : ""} · <span class="${tot < 0 ? "r" : "g"}">${money(tot)}</span>` : "Aucun trade";
}
$("dayRows").addEventListener("input", e => { const el = e.target; if (el.dataset.k) { draft[+el.dataset.i][el.dataset.k] = el.value; if (el.dataset.k === "pnl") { updateSum(); const b = el.parentNode.querySelector(".sgn"); if (b) { const n = /^\s*[-−]/.test(el.value); b.classList.toggle("neg", n); b.textContent = n ? "−" : "+"; } } } });
$("dayRows").addEventListener("change", e => { const el = e.target; if (el.dataset.k) draft[+el.dataset.i][el.dataset.k] = el.value; });
let imgTarget = -1;
$("dayRows").addEventListener("click", e => {
  const del = e.target.closest("[data-del]"), img = e.target.closest("[data-img]"), play = e.target.closest("[data-play]");
  const sg = e.target.closest("[data-sign]");
  if (sg) {
    const i = +sg.dataset.sign, inp = $("r" + i + "-pnl");
    let v = String(draft[i].pnl ?? "").trim().replace(/^[+−-]/, "");
    const toNeg = !sg.classList.contains("neg");
    draft[i].pnl = v ? (toNeg ? "-" : "") + v : (toNeg ? "-" : "");
    inp.value = draft[i].pnl; sg.classList.toggle("neg", toNeg); sg.textContent = toNeg ? "−" : "+";
    updateSum(); inp.focus(); return;
  }
  if (del) { draft.splice(+del.dataset.del, 1); drawRows(); }
  if (img) { imgTarget = +img.dataset.img; $("imgPick").value = ""; $("imgPick").click(); }
  if (play) playTrade(+play.dataset.play);
});
$("imgPick").addEventListener("change", async () => {
  const files = [...$("imgPick").files].slice(0, 6), t = draft[imgTarget];
  if (!t || !files.length) return;
  const b = $("dayRows").querySelector(`[data-img="${imgTarget}"]`); if (b) b.textContent = "Import…";
  const urls = (await Promise.all(files.map(shrink))).filter(Boolean);
  await idb.set(t.id, urls); drawRows();
});
function playTrade(i){
  const t = draft[i], v = num(t.pnl);
  if (!isFinite(v)) { $("dayErr").textContent = "Écris d'abord le résultat de ce trade, par exemple +250 ou -120."; $("dayErr").hidden = false; return; }
  $("dayErr").hidden = true;
  const trade = {...t, day: dayOpen, pnl: v};
  const rows = draft.map(x => num(x.pnl)).filter(isFinite);
  const monthNet = state.trades.filter(x => x.day !== dayOpen).reduce((a, x) => a + x.pnl, 0) + rows.reduce((a, b) => a + b, 0);
  const imgs = imgCache[t.id] || [];
  const slides = buildTradeSlides(trade, imgs, monthNet);
  openStory(false, slides, [2400, ...imgs.map(() => 2300), 2600, 2600]);
}
$("addRow").onclick = () => { draft.push(blankRow()); drawRows(); const ins = $("dayRows").querySelectorAll('input[data-k="pnl"]'); ins[ins.length - 1].focus(); };
$("dayCancel").onclick = () => { $("dayModal").hidden = true; };
$("dayForm").addEventListener("submit", e => {
  e.preventDefault();
  const rows = [], bad = [];
  draft.forEach((t, i) => {
    const empty = !String(t.pnl).trim() && !t.setup.trim() && !t.note.trim();
    if (empty) return;
    const v = num(t.pnl);
    if (!isFinite(v)) { bad.push(i + 1); return; }
    rows.push({id: t.id || uid(), day: dayOpen, pnl: v, sym: t.sym.trim() || "XAUUSD", side: t.side, setup: t.setup.trim(), grade: t.grade, note: t.note.trim()});
  });
  if (bad.length) { $("dayErr").textContent = `Résultat illisible à la ligne ${bad.join(", ")}. Écris un nombre, par exemple +250 ou -120.`; $("dayErr").hidden = false; return; }
  state.trades = state.trades.filter(t => t.day !== dayOpen).concat(rows).sort((a, b) => a.day - b.day);
  save(); renderDash(); $("dayModal").hidden = true;
});

/* ---------- Settings ---------- */
function openSettings(){
  $("fGreet").value = state.greet; $("fName").value = state.name; $("fHandle").value = state.handle; $("fReady").value = state.ready; $("fCur").value = state.currency;
  $("fBulk").value = toText(state.trades); $("setErr").hidden = true; $("setModal").hidden = false;
}
$("btnSettings").onclick = openSettings;
$("setCancel").onclick = () => { $("setModal").hidden = true; };
$("btnSample").onclick = () => { $("fBulk").value = SAMPLE_TEXT; };
$("btnClear").onclick = () => { $("fBulk").value = ""; };
$("setForm").addEventListener("submit", e => {
  e.preventDefault();
  const {trades, bad} = parseText($("fBulk").value);
  const oldIds = new Map(state.trades.map(t => [t.day + "|" + t.pnl + "|" + t.setup + "|" + t.note, t.id]));
  trades.forEach(t => { t.id = oldIds.get(t.day + "|" + t.pnl + "|" + t.setup + "|" + t.note) || uid(); });
  if (bad.length) { $("setErr").textContent = `Lignes illisibles : ${bad.join(", ")}. Vérifie le jour et le résultat.`; $("setErr").hidden = false; return; }
  Object.assign(state, {greet: $("fGreet").value.trim(), name: $("fName").value.trim(), handle: $("fHandle").value.trim(), ready: $("fReady").value.trim() || DEFAULT.ready, currency: $("fCur").value.trim() || "$", trades});
  save(); renderDash(); $("setModal").hidden = true;
});
document.querySelectorAll(".modal").forEach(m => m.addEventListener("click", e => { if (e.target === m) m.hidden = true; }));

/* ---------- Story ---------- */
function curveSVG(curve){
  const W = 640, H = 220, P = 14;
  const min = Math.min(0, ...curve), max = Math.max(0, ...curve), span = (max - min) || 1;
  const x = i => P + i * (W - 2 * P) / Math.max(1, curve.length - 1), y = v => P + (max - v) / span * (H - 2 * P);
  const pts = curve.map((v, i) => [x(i), y(v)]);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const last = pts[pts.length - 1], up = curve[curve.length - 1] >= 0, col = up ? "#62e29c" : "#ff8f6b";
  const area = d + ` L${last[0].toFixed(1)} ${y(min).toFixed(1)} L${pts[0][0].toFixed(1)} ${y(min).toFixed(1)} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe des gains">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <line x1="${P}" x2="${W - P}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" stroke="#2a3532" stroke-dasharray="3 5" stroke-width="1"/>
    <path class="curve-area" d="${area}" fill="url(#ag)"/><path class="curve-line" d="${d}"/>
    <circle class="curve-dot" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="5" fill="${col}"/></svg>`;
}
function tradeCard(t, red){
  return `<div class="card${red ? " red" : ""} rise" style="--d:2">
    <div class="meta">${t.day} ${MONTHS[state.month].toLowerCase()}</div>
    <div class="sym">${esc(t.sym)}<small>${esc(t.side.toUpperCase())}</small></div>
    ${t.setup || t.grade ? `<div class="setup">${t.setup ? `Setup <b>${esc(t.setup)}</b>` : ""}${t.setup && t.grade ? " · " : ""}${t.grade ? `Note <b>${esc(t.grade)}</b>` : ""}</div>` : ""}
    ${t.note ? `<q>${esc(t.note)}</q>` : ""}</div>`;
}
function buildSlides(){
  const s = stats(state.trades), out = [];
  let li = 0;
  const word = (w, cls) => `<span class="w">${[...w].map(ch => `<span class="ltr${cls ? " " + cls : ""}" style="--i:${li++}">${esc(ch)}</span>`).join("")}</span>`;
  const greetWords = state.greet.split(/\s+/).filter(Boolean).map(w => word(w)).join(" ");
  const nameWords = state.name.split(/\s+/).filter(Boolean).map(w => word(w, "name")).join(" ");
  out.push(`<div class="inner"><div class="hello">${greetWords} ${nameWords}</div>
    <div class="banner rise" style="--d:${Math.min(9, Math.ceil(li * 45 / 130) + 2)}"><i class="dot"></i>
    <div><b>${esc(state.ready)}</b><span>${esc(monthName())} · ${money(s.net)} · ${s.n} trades</span></div></div></div>`);
  out.push(`<div class="inner"><span class="pill rise">Bilan du mois</span>
    <div class="title rise" style="--d:1">${esc(monthName())}</div>
    <div class="sub rise" style="--d:2">${s.n} trades · ${s.days.length} jours de trading</div></div>`);
  out.push(`<div class="inner"><span class="pill rise${s.net < 0 ? " red" : ""}">Résultat net</span>
    <div class="big ${s.net < 0 ? "loss" : "gain"} rise" style="--d:1" data-count="${s.net}">${money(s.net)}</div>
    <div class="stats rise" style="--d:2"><div class="stat"><b>${s.winrate}%</b><span>Réussite</span></div><div class="stat"><b class="g">${s.wins}</b><span>Gagnants</span></div><div class="stat"><b class="r">${s.losses}</b><span>Perdants</span></div></div></div>`);
  out.push(`<div class="inner"><span class="pill rise">La forme du mois</span>
    <div class="chart rise" style="--d:1">${curveSVG(s.curve)}</div>
    <div class="chips rise" style="--d:2">
      <div class="chip"><span>Meilleur jour</span><b class="${s.bestDay[1].pnl < 0 ? "r" : "g"}">${money(s.bestDay[1].pnl)}</b><em>${s.bestDay[0]} ${MONTHS[state.month].toLowerCase()}</em></div>
      <div class="chip"><span>Pire jour</span><b class="${s.worstDay[1].pnl < 0 ? "r" : "g"}">${money(s.worstDay[1].pnl)}</b><em>${s.worstDay[0]} ${MONTHS[state.month].toLowerCase()}</em></div>
    </div></div>`);
  if (s.bestTrade.pnl > 0) out.push(`<div class="inner"><span class="pill rise">Meilleur trade</span>
    <div class="big gain rise" style="--d:1" data-count="${s.bestTrade.pnl}">${money(s.bestTrade.pnl)}</div>${tradeCard(s.bestTrade)}</div>`);
  if (s.worstTrade.pnl < 0) out.push(`<div class="inner" data-red><span class="pill red rise">Pire trade</span>
    <div class="big loss rise" style="--d:1" data-count="${s.worstTrade.pnl}">${money(s.worstTrade.pnl)}</div>${tradeCard(s.worstTrade, true)}
    <div class="moral rise" style="--d:3">Chaque mois a le sien. Ce qui compte, c'est ce qu'il t'apprend.</div></div>`);
  out.push(`<div class="inner"><span class="pill rise">${esc(monthName())}</span>
    <div class="title rise" style="--d:1">Au mois suivant.</div>
    ${state.handle ? `<div class="handle rise" style="--d:2">${esc(state.handle)}</div>` : ""}</div>`);
  return out;
}

function buildTradeSlides(t, imgs, monthNet){
  const out = [];
  let li = 0;
  const word = (w, cls) => `<span class="w">${[...w].map(ch => `<span class="ltr${cls ? " " + cls : ""}" style="--i:${li++}">${esc(ch)}</span>`).join("")}</span>`;
  const hello = state.greet.split(/\s+/).filter(Boolean).map(w => word(w)).join(" ") + " " + state.name.split(/\s+/).filter(Boolean).map(w => word(w, "name")).join(" ");
  const when = `${t.day} ${MONTHS[state.month].toLowerCase()}`;
  out.push(`<div class="inner"><div class="hello">${hello}</div>
    <div class="banner rise" style="--d:${Math.min(9, Math.ceil(li * 45 / 130) + 2)}"><i class="dot"></i>
    <div><b>Voici ton trade</b><span>${esc(t.sym)} · ${esc(String(t.side).toUpperCase())} · ${esc(when)}</span></div></div></div>`);
  imgs.forEach((src, i) => out.push(`<div class="inner"><div class="shotwrap"><img class="shot" src="${src}" alt="Capture du trade ${i + 1}">${imgs.length > 1 ? `<span class="shotn">${i + 1} / ${imgs.length}</span>` : ""}</div></div>`));
  const red = t.pnl < 0;
  out.push(`<div class="inner"${red ? " data-red" : ""}><span class="pill rise${red ? " red" : ""}">Résultat du trade</span>
    <div class="big ${red ? "loss" : "gain"} rise" style="--d:1" data-count="${t.pnl}">${money(t.pnl)}</div>${tradeCard(t, red)}</div>`);
  out.push(`<div class="inner"${monthNet < 0 ? " data-red" : ""}><span class="pill rise${monthNet < 0 ? " red" : ""}">${esc(monthName())}</span>
    <div class="sub rise" style="--d:1">Total du mois</div>
    <div class="big ${monthNet < 0 ? "loss" : "gain"} rise" style="--d:2" data-count="${monthNet}">${money(monthNet)}</div>
    ${state.handle ? `<div class="handle rise" style="--d:3">${esc(state.handle)}</div>` : ""}</div>`);
  return out;
}

let idx = 0, els = [], timer = null, anims = [];
const story = $("story"), stage = $("stage"), progress = $("progress");
let DUR = [];
function openStory(auto, slides, durs){
  if (!slides) { if (!state.trades.length) return; slides = buildSlides(); durs = [2600, 1900, 2600, 3100, 2700, 3000, 2400]; }
  DUR = durs || [];
  stage.innerHTML = slides.map(h => `<section class="slide">${h}</section>`).join("");
  els = [...stage.querySelectorAll(".slide")];
  progress.innerHTML = els.map(() => `<div class="seg"><i></i></div>`).join("");
  story.hidden = false; document.body.style.overflow = "hidden";
  go(0); if (auto) startAuto();
}
function closeStory(){ stopAuto(); story.hidden = true; document.body.style.overflow = ""; }
function countUp(el){
  const target = parseFloat(el.dataset.count);
  if (reduced) { el.textContent = money(target); return; }
  const t0 = performance.now(), dur = 1300;
  const step = now => { const k = Math.min(1, (now - t0) / dur); el.textContent = money(target * (1 - Math.pow(1 - k, 3))); if (k < 1) anims.push(requestAnimationFrame(step)); };
  el.style.minWidth = ""; el.textContent = money(target); el.style.minWidth = el.getBoundingClientRect().width + "px";
  el.textContent = money(0); anims.push(requestAnimationFrame(step));
}
function drawCurve(slide){
  const chart = slide.querySelector(".chart"); if (!chart) return;
  const path = chart.querySelector(".curve-line");
  chart.classList.remove("drawn");
  const len = path.getTotalLength();
  path.style.transition = "none"; path.style.strokeDasharray = len; path.style.strokeDashoffset = reduced ? 0 : len;
  path.getBoundingClientRect();
  if (!reduced) path.style.transition = "stroke-dashoffset 1.7s cubic-bezier(.45,0,.2,1) .15s";
  path.style.strokeDashoffset = 0; chart.classList.add("drawn");
}
function go(i){
  anims.forEach(cancelAnimationFrame); anims = [];
  idx = Math.max(0, Math.min(els.length - 1, i));
  els.forEach((el, j) => el.classList.toggle("on", j === idx));
  [...progress.children].forEach((seg, j) => seg.classList.toggle("done", j <= idx));
  const el = els[idx];
  stage.classList.toggle("red", !!el.querySelector("[data-red]"));
  el.querySelectorAll("[data-count]").forEach(countUp);
  drawCurve(el);
}
function schedule(){ clearTimeout(timer); if (idx < els.length - 1) timer = setTimeout(() => { go(idx + 1); schedule(); }, DUR[idx] || 3600); }
function startAuto(){ story.classList.add("filming"); go(0); schedule(); }
function stopAuto(){ clearTimeout(timer); timer = null; story.classList.remove("filming"); }
stage.addEventListener("click", () => { if (story.classList.contains("filming")) { stopAuto(); return; } go(idx >= els.length - 1 ? 0 : idx + 1); });
$("btnPlay").onclick = () => openStory(false);
$("sAuto").onclick = startAuto;
$("sReplay").onclick = () => { stopAuto(); go(0); };
$("sClose").onclick = closeStory;
$("sFull").onclick = () => { try { const p = document.documentElement.requestFullscreen?.(); p && p.catch(() => {}); } catch(e) {} };
document.addEventListener("keydown", e => {
  if (!story.hidden) {
    if (e.key === "Escape") closeStory();
    if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); stopAuto(); go(idx + 1); }
    if (e.key === "ArrowLeft") { stopAuto(); go(idx - 1); }
    return;
  }
  const open = [...document.querySelectorAll(".modal")].find(m => !m.hidden);
  if (open && e.key === "Escape") open.hidden = true;
});

const THEME_KEY = "month-review-theme";
function applyTheme(light){
  document.body.classList.toggle("light", light);
  $("btnTheme").textContent = light ? "☾ Sombre" : "☀ Clair";
  try { localStorage.setItem(THEME_KEY, light ? "light" : "dark"); } catch(e) {}
}
let startLight = false; try { startLight = localStorage.getItem(THEME_KEY) === "light"; } catch(e) {}
applyTheme(startLight);
$("btnTheme").onclick = () => applyTheme(!document.body.classList.contains("light"));

renderDash();
</script>
